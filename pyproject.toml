[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cairo-paper"
version = "0.1.0"
description = "Research code for the CAIRO paper."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
benchmarks = [
  "lightgbm>=4.0",
  "matplotlib>=3.8",
]
deep = [
  "tensorflow>=2.15",
  "torch>=2.2",
  "tweedie>=0.0.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
